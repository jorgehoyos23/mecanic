# Blueprint de Render: en el panel de Render -> New -> Blueprint -> elige este repositorio.
# Sin DATABASE_URL la app usa SQLite dentro del contenedor (los datos se reinician al redeplegar).
# Para datos permanentes: crea un Postgres en Render y agrega la variable DATABASE_URL al servicio.
services:
  - type: web
    name: mecasolic
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/health
    envVars:
      # Internal Database URL de tu Postgres en Render (se pega a mano en Environment; no se guarda aquí)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
