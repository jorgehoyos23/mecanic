# API Gateway: único punto de entrada de la plataforma.
#   /                      -> frontend web (archivos estáticos)
#   /api/<servicio>/...    -> microservicio correspondiente (se elimina el prefijo)

# Resolución dinámica: el gateway arranca aunque algún servicio aún no esté listo
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/(?<svc>auth|clientes|mecanicos|servicios|ordenes|inventario|facturacion|notificaciones)/(?<rest>.*)$ {
        proxy_pass http://$svc:8000/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Servicio no encontrado"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
